# ==============================================================================
# 文件职责：pytest 的**全局**运行配置。只放"与具体用例无关、每次跑测试都必须成立"
#           的设定；任何一个个例的特殊需求应写在该用例内部，不往这里堆。
#
# 上下游依赖：
#   - 上游：被 `make test`（Makefile）与 CI 调用。
#   - 下游：作用于 tests/ 下全部用例；其中 `pythonpath` 负责让测试无需外部
#           PYTHONPATH 设置即可直接 `pytest`。
#
# 为什么需要这个文件（而不是用 pyproject.toml）：
#   本项目的依赖清单 requirements.txt 里 `pytest-asyncio` 那一行的注释明确写了
#   「配合 pytest.ini 的 asyncio_mode=auto」，即该文件名已被依赖清单引用
#   （刻意不写行号：requirements.txt 每次增删依赖都会让行号漂移）。
#   pytest 的配置发现顺序里
#   pytest.ini 优先级最高，且它不会被 setuptools/packaging 的构建逻辑读到 ——
#   本项目不是要发布的分发包，不存在打包需求，用最直白的 ini 即可。
# ==============================================================================

[pytest]

# ------------------------------------------------------------------------------
# 测试发现范围
# ------------------------------------------------------------------------------
# 只扫 tests/，避免 pytest 递归进 third_party/ 把 AgentScope 与 ReMe 自带的
# 上千个用例也一起跑了 —— 那些是上游代码的测试，不属于本项目验收范围，
# 跑了既拖慢速度，也会把上游的失败误报成本项目的失败。
# （即使 third_party 已不参与导入，它仍在仓库里，故这条排除依然必要。）
testpaths = tests

# 用例文件与函数命名约定：保持 pytest 默认约定，显式写出以免未来改名时踩坑。
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# ------------------------------------------------------------------------------
# asyncio 支持（关键项）
# ------------------------------------------------------------------------------
# auto 模式：凡是 `async def` 的测试函数与夹具都会被自动当作协程执行，
# 不必逐个加 `@pytest.mark.asyncio`。本项目是全程异步的服务（FastAPI + SQLAlchemy
# async + redis.asyncio），几乎每个用例都是 async 的，逐个标注纯属噪声。
# ⚠️ 少了这一行，所有 async 用例都会被当成"返回了协程对象但从未 await"而静默通过 ——
#    这是最危险的一种失败：测试全绿，实际一行断言都没执行。
asyncio_mode = auto

# 异步**夹具**所在的事件循环作用域。不显式设置时 pytest-asyncio 1.x 会发出
# DeprecationWarning（未来版本将改变默认值），提前钉死以免升级依赖后行为突变。
# 取 function：与本项目夹具的实际作用域一致（app / client 都是函数级），
# 每个用例拿到全新的事件循环与全新的 sqlite 库，用例之间零串扰。
asyncio_default_fixture_loop_scope = function

# ------------------------------------------------------------------------------
# 模块搜索路径
# ------------------------------------------------------------------------------
# 让 `pytest tests/` 在不预设环境变量的前提下也能跑通。
#
# ⚠️ 这里**只放仓库根**，刻意不写 third_party 的路径：
#   agentscope 与 reme 已装进当前 Python 环境（`import agentscope` / `import reme` 可直接用），
#   容器内则由 Dockerfile 在构建期把同一份源码装进 /opt/venv。
#   由**安装元数据**决定解析结果，而不是由本文件硬编码一条路径 —— 硬编码的代价是：
#   该路径只在「仓库就地跑」时存在，换到容器或换台机器立刻失效，而失效方式是一句
#   难以定位的 ImportError。
#   ⚠️ 但**不要**因此以为「本地与容器跑的是同一份代码」：实测两者各有错位，
#      详见 README「三条硬性约定」第 2、3 条与 Dockerfile 的安装段注释。
#      （本机 agentscope 是 editable 安装，.pth 恰好也指到 third_party/agentscope/src；
#       reme 则来自 PyPI 的 0.4.1.12，与仓库 vendored 的 0.4.1.13 有 24 处差异。）
#   注：仓库里的 third_party/ 仍然保留，它是两个包的**安装源码来源**。
# ⚠️ 路径相对于本 ini 文件所在目录（即仓库根），故不能写成绝对路径。
pythonpath =
    .

# ------------------------------------------------------------------------------
# 输出可读性
# ------------------------------------------------------------------------------
# -ra：结尾统一汇总"非通过"用例（跳过/预期失败等），避免它们被淹没在滚动日志里。
# --tb=short：只打精简回溯。本项目的失败大多来自 HTTP 状态码与探针字段断言，
#             full 回溯里 90% 是 starlette/httpx 的中间帧，反而看不到自己的代码。
addopts = -ra --tb=short

# 日志在测试失败时才有必要看：捕获日志并按用例分段，失败时随报告一起打印。
log_cli = false
log_level = WARNING
