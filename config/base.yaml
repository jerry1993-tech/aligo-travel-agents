# ==============================================================================
# 文件职责：AliGo 差旅助手的**基础配置**（所有环境共享的默认值）。
#
# 上下游依赖：
#   - 上游：由 `src/config/loader.py` 读取，与 `config/{env}.yaml` **深合并**，
#           再被 `ALIGO__<段>__<键>` 形式的环境变量覆盖，最终校验成 `src/config/schema.py`
#           里的 `Settings` 对象。
#   - 下游：`src/server/app.py` 用它装配整个应用；`src/llm/factory.py` 用它建模型。
#
# 加载优先级（后者覆盖前者，逐层深合并）：
#   1. 本文件 config/base.yaml
#   2. config/{env}.yaml         （env 由 ALIGO__APP__ENV 决定，默认 dev）
#   3. 环境变量 ALIGO__<段>__<键>  （例：ALIGO__LLM__MODEL 覆盖 llm.model）
#
# ⚠️ 三条硬性约定，改本文件前务必先读：
#   1) **未知键会让进程直接崩**：schema 对每一层都设了 extra="forbid"，
#      多写一个 schema 里没有的键，启动即抛
#          ValueError: 配置校验失败（环境 'dev'）… Extra inputs are not permitted
#      这是刻意的 —— 拼错的键若不报错，就会静默取默认值，那是最难发现的一类偏差。
#      新增键的标准流程：先加 `src/config/schema.py` 的字段，再回到本文件写默认值。
#   2) **`${VAR}` 会被展开**：字符串值里的 `${NAME}` 由 loader 用**进程环境变量**
#      替换（不是 YAML 自己的语法，PyYAML 不认它）。这样密钥只有一处真值 ——
#      写在 .env 里，由 compose 注入容器，本文件只引用。未设置的变量展开为空串，
#      loader 会打一条告警列出名字（见 loader.py 的 _expand_env 段）。
#   3) **本文件的值会被 ALIGO__ 环境变量整片顶掉**：例如 .env 里写了
#      ALIGO__MILVUS__COLLECTION，那么下面 milvus.collection 写什么都不算数。
#      两处真值是本项目反复强调要避免的东西 —— 要改配置请**只改一处**。
# ==============================================================================

# ------------------------------------------------------------------------------
# 一、应用本体
# ------------------------------------------------------------------------------
app:
  # 运行环境。**只能取 dev / test / prod**（schema 里是 Literal，写错直接报错）。
  # 它决定加载 config/ 下的哪个 YAML，也决定日志是否彩色输出。
  env: dev
  # 日志级别：DEBUG / INFO / WARNING / ERROR / CRITICAL。
  # ⚠️ config/dev.yaml 会把它提升到 DEBUG；若 .env 里又写了 ALIGO__APP__LOG_LEVEL，
  #    则 .env 胜出（环境变量优先级最高）。三处取值必须自洽 —— 见 .env.example §二。
  log_level: INFO
  # 服务监听端口（容器内固定 8000）。宿主机映射端口见 docker-compose.yaml 的 app.ports。
  port: 8000
  # uvicorn worker 进程数。**默认且推荐保持 1**，理由有两条，都与正确性有关而非性能：
  #   1) SchedulerManager 的 APScheduler jobstore 在内存里，每个 worker 进程都会
  #      独立触发一次 cron —— N 个 worker 就是 N 次重复执行（框架注释已明示）；
  #   2) 连接池要算总账：db 段 pool_size+max_overflow = 30，即**单进程**峰值 30 条连接，
  #      N 个 worker 就是 N×30，很容易打爆 PostgreSQL 的 max_connections。
  # 扩容到多 worker 前，请先把调度器拆成独立进程（create_app 的 enable_scheduler=False）。
  workers: 1
  # 工作区文件下载 token 的签名密钥（create_app 的 download_secret 参数）。
  #
  # ⚠️ 默认留空 = 让框架**每进程随机生成**一个。这在当前拓扑下是**正确**的：
  #    本项目 WORKERS=1 且单实例（见上面的 workers 注释）。
  #    但一旦扩到**多副本**（多个容器 / 多个 worker），随机密钥就会出事：
  #    A 副本签发的下载 token 到了 B 副本验证不过，症状是「点下载随机失败、
  #    刷新一下可能又好了」—— 用户报的是「偶尔打不开」，几乎无法从现象定位到根因。
  #    扩副本时请务必设置 ALIGO_DOWNLOAD_SECRET（≥32 位随机串），并让所有副本一致。
  #
  # 用 `${ALIGO_DOWNLOAD_SECRET:-}` 而不是 `${ALIGO_DOWNLOAD_SECRET}`：
  # 后者在变量未设置时会被 loader 记进 missing 列表并打一条告警，
  # 而「没设置」在这里是**预期状态**（见上），不该产生噪声。`:-` 形式表示
  # 「缺失是允许的，用空串」，详见 src/config/loader.py::_expand_env。
  download_secret: "${ALIGO_DOWNLOAD_SECRET:-}"

# ------------------------------------------------------------------------------
# 二、鉴权
# ------------------------------------------------------------------------------
# 服务层沿用 AgentScope app 的 `x-user-id` 请求头模型：不带任何凭据也能匿名跑通，
# 这正是「零密钥可运行」得以成立的原因之一。
auth:
  # true  ⇒ 业务接口必须带 `X-User-ID` 请求头，缺失即拒绝。
  # false ⇒ 允许匿名。**只在本地调试时**关掉，不要在生产关。
  #
  # ⚠️ 缺头时的状态码是 **401**，由我们自己的 Auth 中间件返回
  #    （src/server/middleware/auth.py）——它挡住了请求，框架的依赖根本没机会跑。
  #    本行早先写的是「缺失返回 400，由框架的依赖注入强制」，两处都不对：
  #      · 框架侧实测是 **422** —— deps.py 的 `x_user_id: str = Header(...)`
  #        没有默认值，FastAPI 在**进入函数体之前**就以「缺少必填 header」返回 422；
  #        函数体里那句 401 只在「头存在但为空串」时才会命中。
  #        （所以框架 docstring 自称的 401 与它自己的代码也不一致。）
  #      · 而只要本中间件开着，请求就到不了框架依赖，实际返回的是我们的 401。
  #    三条路径的取值都写在这里，免得下一个人再照 docstring 猜一次。
  require_user_header: true
  # 可选 JWT Bearer 通道（甲方决策：X-User-ID 为主 + 可选 JWT）。
  # 开启后，`Authorization: Bearer <token>` 会被解析，取其中的 `sub` 作为 user_id，
  # 并**注入成 X-User-ID**，从而复用框架既有的鉴权与多租户隔离链路。
  # ⚠️ 开启时 jwt_secret 必须非空，否则启动即报错（配置层的交叉校验）。
  jwt_enabled: false
  jwt_secret: ""
  jwt_algorithm: HS256
  # 下列两项为**空串时不做校验**；非空则校验，不匹配即 401。
  jwt_audience: ""
  jwt_issuer: ""

# ------------------------------------------------------------------------------
# 二·补、限流（中间件见 src/server/middleware/rate_limit.py）
# ------------------------------------------------------------------------------
# 按**身份**限流，身份取自请求头 X-User-ID（由 Auth 中间件注入的可信值），
# 取不到时回落到客户端 IP。实现是令牌桶，按 requests_per_window / window_seconds
# 的速率匀速回填。
#
# ⚠️ **计数器在进程内存里**。本项目 workers=1 且单实例，这是零额外延迟、
#    零新依赖的正确选择。但一旦扩到多副本，每个副本各限一份 —— 实际放行的
#    总量是这里的 N 倍，而**它不会报错**，只是不再拦住任何东西。
#    扩副本前必须把计数器换成 Redis 共享实现（redis 段已有连接参数可直接复用）。
#    这条限制与「SSE 必须用 RedisMessageBus」是同一类问题：单进程内自洽，
#    多副本下静默失效。
ratelimit:
  # 总开关。关掉时中间件直接透传，行为与没有限流完全一致（便于压测取基线）。
  enabled: true
  # 每个窗口允许的请求数。它同时是令牌桶的**容量**，即允许的瞬时突发上限。
  # 120/分钟 = 平均 2 QPS。取值依据：正常对话一轮会产生 1 次 POST /chat/ 加
  # 1 条常连的 SSE（SSE 在连接建立时只计一次，不会持续消耗令牌），
  # 因此 120 够一个人正常用；而暴力枚举会话 id 的脚本会立刻撞上 429。
  requests_per_window: 120
  # 窗口长度（秒）。令牌以 requests_per_window / window_seconds 的速率匀速回填。
  window_seconds: 60.0
  # 计数器字典的容量上限，超限时淘汰令牌已回满的条目。
  # **不能省**：身份来自请求头，不设限时一个伪造身份的脚本就能让字典无限增长，
  # 把一次外部扫描升级成一次内存耗尽。
  max_keys: 10000
  # 不计入限流的路径前缀。⚠️ 探针必须在这里：被限流的 /healthz 会让编排系统
  # 误判容器已死并重启它，而容器其实是健康的 —— 经典的「健康检查把自己打挂」。
  exempt_paths:
    - /healthz
    - /readyz
    - /metrics

# ------------------------------------------------------------------------------
# 三、PostgreSQL（业务库 + AgentScope 会话/消息/凭据表）
# ------------------------------------------------------------------------------
db:
  # 异步连接串。**主机名 `postgres` 是 compose 服务名**，容器间靠它做 DNS 解析。
  # 占位符在容器内由 compose 注入的 POSTGRES_* 展开（见本文件头部约定 2）。
  # ⚠️ 本地（不经 compose）跑时，想让占位符有值，请确保已 `cp .env.example .env` ——
  #    loader 会自动加载仓库根的 .env（python-dotenv），非容器环境因此也能拿到这些值。
  # ⚠️ 不要在 .env 里另行设置 ALIGO__DB__URL：那会绕过上面的占位符，形成「两处真值」，
  #    表现是「改了 POSTGRES_PASSWORD 却认证失败」，而配置文件看起来完全正确。
  url: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  # SQLAlchemy 异步连接池参数（高并发关键）。改 pool_size / max_overflow 时
  # 请连同 app.workers 一起算总账，见上方 app.workers 的注释。
  pool_size: 10
  max_overflow: 20
  # 连接回收前的秒数。设它是为了绕开一个很难归因的故障：网络中间设备（NAT/LB）
  # 会**静默掐断**空闲 TCP 连接，而被掐断的连接要到**下一次使用**时才报错
  # （典型症状是随机的 "server closed the connection unexpectedly"）。
  # 把连接在使用前主动回收重建，就能把这颗雷提前拆掉。
  #
  # ⚠️ 取值方向是「**回收周期 < 中间设备的空闲超时**」才有效：
  #    云厂商 LB 的空闲超时常见为 350s～900s，而本项目契约给的 1800s（30 分钟）
  #    **长于**它们 —— 也就是说这 1800s 并不能覆盖那类网关，别把它当成已解决。
  #    它与连接池大小是**互相制约**的：回收越频繁，重建连接的开销越大（TLS 握手 +
  #    认证往返），高并发下会明显吃掉吞吐；回收越少，踩到陈旧连接的概率越高。
  #    1800s 是这两者之间的折中（也是 .env.example 里钉死的值），
  #    若部署环境前面真有 900s 空闲超时的 LB，请把它调到 600 以下。
  pool_recycle_seconds: 1800
  # 池被占满时，**等一条空闲连接**的秒数上限。必须 > 0。
  # ⚠️ 它与「语句慢」是两种不同的等待，所以要单独设：数据库本身很快也可能
  #    卡在这里 —— 慢查询堆积、连接换了没还、PG 侧 max_connections 打满，
  #    任何一种都会让新请求在池前排大队。SQLAlchemy 的默认值是 30s
  #    （见 sqlalchemy/pool/base.py 的 QueuePool 默认参数），那意味着
  #    「数据库其实很快、只是池满了」会表现成**每个请求都卡半分钟** ——
  #    与「数据库挂了」在监控上几乎分不开。5s 是「正常排队能过、
  #    异常时快速响」的分界。
  pool_timeout_seconds: 5.0
  # **单条语句**的执行秒数上限。必须 > 0（PostgreSQL 的 0 表示「不限制」，
  # 那会让一次全表扫描把连接一直占着，直到池被占满 —— 而池满的后果见上一项）。
  # ⚠️ 它在 PostgreSQL 侧生效：超时后由 PG 自己杀掉查询并返回明确的错误，
  #    连接干净地回到池里。客户端同时会设一个 `command_timeout`
  #    （= 本值 + 5s），用来兜住「连不上 / 没有回应」那类 PG 帮不上忙的情况。
  #    两者的差值方向是刻意的：客户端**必须**比服务端晚一步放弃，否则连接会
  #    带着一条仍在运行的查询回到池里（详见 src/storage/engine.py 的注释）。
  # ⚠️ 只在 PostgreSQL（asyncpg）生效；sqlite 没有这个概念，也不会被传参。
  statement_timeout_seconds: 10.0
  # 启动时自动建表。这是 AgentScope `AsyncSQLAlchemyStorage` 的 create_tables 参数。
  # ⚠️ 与之配对的 `auto_migrate` 在本项目里**恒为 False**，且不对外暴露成配置项：
  #    框架源码明确警告多副本并发迁移不安全（_storage.py:137-142），故由本开关建表、
  #    由 alembic 负责业务 schema 的迁移。生产若要多副本，请把本项改为 false 并预跑迁移。
  create_tables: true
  # 是否把 SQL 打印到日志。仅本地排障时打开，**生产必须关**（会把数据写进日志）。
  echo: false

# ------------------------------------------------------------------------------
# 四、Redis（会话状态、幂等锁、SSE 事件总线 pub/sub）
# ------------------------------------------------------------------------------
redis:
  # 同理：主机名 `redis` 是 compose 服务名，密码由 REDIS_PASSWORD 展开。
  # ⚠️ 不要同时在 .env 里设 ALIGO__REDIS__URL，理由同上。
  url: "redis://:${REDIS_PASSWORD}@redis:6379/0"
  # 连接池上限。SSE 长连接会长期占用连接，故不能按「请求数」估，要按「并发会话数」估。
  max_connections: 50
  # 单次操作的 socket 超时（秒）。**必须显式设置**：不设时 redis-py 会一直等，
  # 依赖不可达时表现为请求挂死而不是报错，最容易把一次可快速定位的故障拖成一次线上事故。
  socket_timeout_seconds: 5.0

# ------------------------------------------------------------------------------
# 五、Milvus 向量库（standalone；本项目**唯一**向量库，不提供 pgvector 备选）
# ------------------------------------------------------------------------------
# ⚠️ 本节的 collection / dimension 会被 .env 里的同名 ALIGO__ 键覆盖，
#    且 .env.example 给出的是带 `_dev` 后缀的值 —— 这是刻意的，防止开发期数据
#    写进生产要用的集合。切到 prod 档时请一并去掉后缀（见 config/prod.yaml）。
milvus:
  # gRPC 地址。容器内走服务名 `milvus`，19530 是 gRPC 端口（9091 是指标/健康端口）。
  uri: "http://milvus:19530"
  # 集合名。**本项目用单集合策略**：所有知识库共用一个集合，靠 metadata 过滤做
  # KB / 租户隔离（对应 P4 的 SingleCollectionKbManager）。这与框架自带的
  # CollectionPerKbManager（每库一个集合）不同 —— 契约要求集合名可配置，故必须单集合。
  collection: aligo_travel_policy
  # 向量维度。**必须与所选 Embedding 模型的输出维度一致**，否则写入/检索直接失败。
  # 1024 对应 DashScope text-embedding-v3 与本地 BGE-large-zh（本项目 Embedding 三合一
  # 的前两条通道）。换模型必须同步改这里，并**重建集合**（维度不可原地修改）。
  dimension: 1024
  # 索引类型：HNSW 适合中小规模、高召回、低延迟；IVF_FLAT 更省内存但需先训练。
  index_type: HNSW
  # 距离度量。COSINE 对文本 Embedding 是常规选择（与归一化后的内积等价）。
  metric_type: COSINE
  # 检索返回的候选条数（RAG 召回阶段）。Rerank 会在此基础上重排取前若干条。
  top_k: 5
  # 单次**读**操作（检索 / 列文档 / 列分块）的超时秒数。
  # ⚠️ 这一项不是性能调优，是**可用性**：框架的 MilvusLiteStore.search 没有任何
  #    超时，底下的 pymilvus 又把 timeout=None 直接交给 gRPC —— 2026-10-03 实测
  #    Milvus 卡死时，一次检索把整个对话请求拖到永不返回（smoke 只收到
  #    REPLY_START）。超过本值即放弃本次检索并降级为「无结果」，
  #    连续 3 次失败还会熔断 30 秒（见 src/knowledge/guard.py）。
  #    写路径（insert/delete/create_collection）刻意不受此限制：它们只出现在
  #    离线脚本里，卡住应当暴露给人，而不是被悄悄超时掉。
  search_timeout_seconds: 5.0

# ------------------------------------------------------------------------------
# 五·B、Embedding（向量化模型 —— 「三合一」降级链）
# ------------------------------------------------------------------------------
# ⚠️ 为什么需要这一节：milvus.dimension 只是一个**数字**，它必须等于
#    真正产出向量的那个模型的输出维度。这个「等于」关系由 schema 的
#    validator 在**启动时**强制（不相等直接起不来），而本节声明的是
#    「用哪个模型」—— 两者要一起改，schema 会拦住只改一个的情况。
embedding:
  # 首选实现。dashscope（云）→ local（本地 ONNX/BGE）→ mock（确定性假向量）。
  # ⚠️ local 档**不引入 torch**：torch 在容器里要装 800MB+，而本机 pip 只有
  #    180–240 kB/s（见 README 的前置说明）。ONNX Runtime 只要 ~150MB。
  provider: dashscope
  # 云端的向量模型名。text-embedding-v4 输出 1024 维，与下面的 dimension 对齐。
  model: text-embedding-v4
  # 输出维度。**必须与 milvus.dimension 相等**（schema 会校验）。
  dimension: 1024
  # 本地模型标识（provider=local 时使用）。bge-small-zh-v1.5 是 512 维，
  # 与上面的 1024 不符 —— 所以切到 local 档时**必须同时改 dimension 与
  # milvus.dimension 并重建集合**。这里保留默认值只是为了让配置项可见，
  # 不代表「换成它就能直接跑」。
  local_model: BAAI/bge-small-zh-v1.5
  # 首选不可用时是否降级。
  # ⚠️ **生产环境应当设为 false**：Mock 向量之间没有语义，检索会「成功」
  #    但召回结果无意义 —— 那比检索失败更难发现。开发/CI 保持 true 为好。
  allow_fallback: true
  # 单次向量化调用的超时（秒）。与 milvus.search_timeout_seconds 同一性质：
  # **可用性参数，不是性能调参**。检索路径是「先向量化、再查库」，
  # 只箍住查库那一段的话，向量模型卡住时请求会卡在向量化那一步，
  # 而向量库那边的超时与熔断连介入的机会都没有（见 src/web_embedding/bounded.py）。
  # 默认 30s 比检索超时宽松一档：向量化是外网 + 批量调用，正常就该慢一些。
  timeout_seconds: 30.0

# ------------------------------------------------------------------------------
# 五·C、检索重排（Rerank —— 可选阶段）
# ------------------------------------------------------------------------------
rerank:
  # 是否在检索后加一步重排。**默认关闭**：重排让每次检索多一次模型调用
  # （延迟 + token 费用），收益只体现在召回质量上，应当显式打开。
  enabled: false
  # 重排用的**对话**模型名。留空 = 复用主对话模型（llm.model）。
  # ⚠️ 本框架的重排是 LLM-as-reranker（RAGMiddleware 收 ChatModelBase +
  #    提示词），**不是** DashScope 的 TextReRank 接口 —— 填 `qwen3-rerank`
  #    这类专用重排模型名会在调用时报错，框架会吞掉异常并退回向量序
  #    （重排是尽力而为的，失败不会让检索整体失败）。
  model: ""

# ------------------------------------------------------------------------------
# 五·D、长期记忆 / 用户画像
# ------------------------------------------------------------------------------
memory:
  # 自研画像（Postgres 结构化 + Milvus 语义召回）的总开关。
  enabled: true
  # 框架自带的 ReMe 长期记忆中间件。**默认关闭**，理由见 schema 的
  # MemorySettings 文档：本项目以自研画像为主，框架那套作为可选增强。
  # 打开前请确认 `reme-ai` 已安装（本地环境为 0.4.1.12，已装）。
  reme_enabled: false
  # ReMe 的工作目录（reme_enabled=true 时才使用）。
  workspace_dir: ".reme"
  # 语义召回返回条数。
  top_k: 5

# ------------------------------------------------------------------------------
# 六、LLM（大模型）
# ------------------------------------------------------------------------------
# 默认 Provider：DashScope（阿里云百炼）—— 甲方 2026-10-01 拍板。
# 走 agentscope 的 **DashScopeChatModel**（框架对百炼的原生实现，而非通用兼容协议档），
# 因此能用到 thinking_enable / thinking_budget / top_k 等 DashScope 特有字段 ——
# 这些是 P3「显示推理」的前提。可选的 `openai` 档保留给 OpenAI 兼容端点
# （vLLM / SGLang / 网关 / 其它厂商），换服务商只改 base_url、不改代码。
# ⚠️ api_key 的**真值在 .env**（DASHSCOPE_API_KEY），本文件只做引用。
#    这样密钥不入库、不进镜像层。
# ⚠️ **换 provider 时要同时换 api_key 的来源**：api_key 这一行写死了引用
#    DASHSCOPE_API_KEY，因此改成 `provider: openai` 而不动它，会拿百炼的密钥去
#    请求别家的端点（或者拿一个空串）。切档时二选一：
#      · 在 .env 里加一行 `ALIGO__LLM__API_KEY=<密钥>`（环境变量优先级更高，不用改本文件）；或
#      · 把下面 api_key 的引用改成对应厂商的变量名。
#    两者是**耦合**的，而耦合点写在一行 YAML 里、从 provider 那一行看不出来 ——
#    所以在这里显式说明，而不是指望读的人自己发现。
llm:
  # 走哪家的协议。合法值见 schema 的 Literal —— 写错会在**配置加载期**报错。
  provider: dashscope
  # 模型名。⚠️ 覆盖请用 `ALIGO__LLM__MODEL=...`；.env 里的 `LLM_MODEL` 是**死键**
  # （loader 只认 ALIGO__ 前缀），写它不生效 —— 这一点在 .env.example §一 有专门说明。
  # 模型名必须与 provider 匹配：qwen* 配 dashscope，配到 openai 档会 404。
  model: qwen3.8-flash
  # API Key：从 .env 的 DASHSCOPE_API_KEY 展开。
  api_key: "${DASHSCOPE_API_KEY}"
  # 端点。这里用 `${VAR:-默认值}` 语法把百炼的 OpenAI 兼容模式地址写进**默认值**：
  # 正常情况下 .env 里根本不需要出现 DASHSCOPE_BASE_URL，而需要指向代理/网关时
  # 又可以在 .env 里覆盖，不必回来改本文件。
  # ⚠️ 末尾必须带 `/v1`：框架把它拼给 AsyncOpenAI 当 base_url，
  #    少一段会退化成请求 `https://dashscope.aliyuncs.com/chat/completions` ⇒ 404。
  base_url: "${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
  # 单次请求超时（秒）。覆盖建连与读取两段，最终落到 httpx 的 timeout 上。
  timeout_seconds: 60.0
  # 最大重试次数。⚠️ 框架的重试是**固定间隔、无指数退避**的
  # （third_party/agentscope/src/agentscope/model/_base.py:206-252），且只对
  # 「可重试异常」生效。持续失败由下面的熔断器处理，二者分工明确。
  max_retries: 2
  # 重试之间的固定等待（秒）。与 max_retries 配对使用。
  retry_backoff_seconds: 0.5
  # 生成参数。
  max_tokens: 4096
  temperature: 0.3
  # ---- 零密钥降级（本项目的「零密钥可运行」就靠它）----
  # 当且仅当 use_mock_when_no_key 为 true **且** api_key 为空时，
  # build_chat_model 返回 MockLLM：它不联网、不花钱，但能走完整个调用链路，
  # 让服务、前端、探针在没有任何密钥的机器上也完全可用。
  # ⚠️ 两个条件缺一不可 —— 只把 api_key 留空但把本项设为 false，会得到一个
  #    启动即报错的模型，而不是降级。这是刻意的：显式关闭降级却又不给 key，
  #    属于配置矛盾，应当尽早暴露。
  use_mock_when_no_key: true
  # ---- 熔断器（自研，框架没有这个能力；实现见 src/llm/breaker.py）----
  # 与重试的分工：**重试对付偶发失败，熔断对付持续失败**。
  # 连续失败达到阈值即「开路」，在此后的一段时间内直接快速失败、不再打网络，
  # 给下游恢复的时间；冷却期满后放一个请求过去试探（半开）。
  # ⚠️ 全体智能体**共享同一个熔断器实例** —— 否则每个会话各熔各的，
  #    下游真的挂了也久久不熔断，起不到保护作用。
  circuit_breaker_failure_threshold: 5
  circuit_breaker_recovery_seconds: 30.0

# ------------------------------------------------------------------------------
# 七、可观测（Prometheus 指标 + OpenTelemetry trace → Langfuse）
# ------------------------------------------------------------------------------
observability:
  # /metrics 端点开关。关掉后该路由返回 404（Prometheus 那边会显示 target down）。
  metrics_enabled: true
  # ⚠️ 本项**当前没有代码消费点**：/metrics 是 Prometheus 每次抓取时**实时渲染**的，
  #    应用侧并没有一个「采集循环」按这个间隔去采样。把本值写成与
  #    scripts/prometheus/prometheus.yml 的 scrape_interval 相同（15s），
  #    只是为了人工核对时两个数字一致，**改它不会改变抓取频率**。
  metrics_interval_seconds: 15
  # 服务名，作为 trace 的 service.name 资源属性，在 Langfuse 里用于区分来源。
  service_name: aligo-travel
  # ---- trace 外发 ----
  # ⚠️ trace_exporter 与 otlp_endpoint **必须成对生效**：装配条件是
  #    `trace_exporter == "otlp"` **且** `otlp_endpoint` 非空，二者缺一不装。
  # 取值：
  #   none    —— 不装配导出器（默认）。这是 core 档的取值，零噪声。
  #   console —— 导出到标准输出，仅本地排障用。
  #   otlp    —— 导出到 OTLP 端点（Langfuse）。由 `make up-tracing` 注入。
  # ⚠️ 为什么默认是 none 而不是 otlp：接收端 langfuse 只在 tracing 档存在。
  #    默认 otlp 会让 `make up`（core 档）的应用一直去连一个解析不了的域名，
  #    导出器按批重试并刷 ERROR 日志 —— 于是一个本来完全正常的 core 档看起来像坏了。
  trace_exporter: none
  # OTLP 接收端。Langfuse v3 的路径固定为 /api/public/otel/v1/traces（要求 >= 3.22.0）。
  otlp_endpoint: ""
  # Langfuse 的 API 密钥对。v3 的 OTLP 摄取**必须带 HTTP Basic 认证头**
  # （用户名 = public key，密码 = secret key），缺了它一律 401，而 **401 不可重试**
  # （导出器只重试 408 与 5xx）⇒ 整批 trace 被静默丢弃。
  # 因此 src/observability/tracing.py 在密钥为空时会**明确告警并跳过装配**，
  # 而不是装一个注定 401 的导出器 —— 那样只会得到「应用照常跑、日志反复报错、
  # Langfuse 里一条都没有」这种最难归因的症状。
  # 真值在 .env 的 LANGFUSE_INIT_PROJECT_*（由 compose 注入）。
  langfuse_public_key: "${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}"
  langfuse_secret_key: "${LANGFUSE_INIT_PROJECT_SECRET_KEY}"
  # Langfuse 控制台地址（仅供日志与文档引用；OTLP 上报走上面的 otlp_endpoint）。
  langfuse_enabled: false
  langfuse_host: "http://langfuse:3000"

# ------------------------------------------------------------------------------
# 八、灰度发布（P3/P4 生效）
# ------------------------------------------------------------------------------
# 按 tenant / user 维度把流量路由到不同版本的智能体实现。
# 实现方式：智能体按版本号注册进注册表（src/agents/registry.py），
# 请求进来时由 src/orchestration/gray.py 依据本节的开关与 default_version 选型。
gray:
  # 总开关。关掉时所有流量都走 default_version，行为与没有灰度完全一致。
  enabled: false
  # 未命中任何灰度规则时的兜底版本。
  default_version: v1

# ------------------------------------------------------------------------------
# 九、编排（快慢车道 + 多智能体调度）
# ------------------------------------------------------------------------------
# 形状定义在 src/config/schema.py 的 OrchestrationSettings；
# 消费方是 src/orchestration/（分类器读阈值，中间件读开关）。
orchestration:
  # 快车道总开关。
  # ⚠️ 保留这个开关是为了**排查**而非省事：线上出现「回复内容不对」时，
  # 第一个要排除的假设就是「是不是快车道规则误命中了」。关掉它就能一刀
  # 切开两种可能，而不必回滚代码 —— 回滚要重新发布，关开关只要重启。
  fast_lane_enabled: true

  # 归一化后允许走快车道的最大长度。
  # ⚠️ 这是第二道网，不是主要机制：主要机制是「精确匹配」本身（归一化只删
  # 前后缀、不压缩句子，所以长句不会退化成一短串）。它的真正用途是挡住
  # **将来给归一化加规则**时引入的意外塌缩。现有触发短语最长 8 字，
  # 20 有充足余量，不会误伤。详见 src/orchestration/classifier.py。
  fast_lane_max_chars: 20

  # 意图置信度阈值：低于它就**追问澄清**，而不是按最高分意图直接调度。
  # ⚠️ 为什么需要它：模型面对「都不太像」的输入时会挑一个最接近的意图，
  # 此时 confidence 通常不高（0.3~0.5）。低于阈值的正确处置是问用户，
  # 而不是替用户猜 —— 猜错的代价是整条链路白跑一遍。
  # 调高的效果：更爱追问（用户体验啰嗦，但更少做错事）。
  # 调低的效果：更爱直接动手（更顺畅，但可能答非所问）。
  intent_confidence_threshold: 0.6

  # 是否按对话阶段动态组装 system prompt（即博客里的 get_prompt_main_plan）。
  # 关闭后使用静态提示词 —— 主要用于对比「动态提示词到底带来了多少收益」，
  # 这是一个可被评测集量化的开关，而不是一个「关掉更快」的性能开关。
  dynamic_prompt_enabled: true

  # 单轮最多调度几个子智能体。
  # ⚠️ 必须有上限：多意图输入（「订票并查一下报销标准」）会解析出多个意图，
  # 若无上限，一次请求可能触发一串子调用，把延迟和成本都放大到不可控。
  # 超限时的处置由编排层决定（通常是先做前 N 个，并告知用户其余待办）。
  max_subagent_calls: 5

  # 是否把模型的推理过程（显示推理）呈现给用户。
  # 关闭后思考链只显示任务状态，不显示推理文本。
  # 保留它的理由见博客：显示推理本身能提升意图识别准确度，所以「关掉」
  # 不应是为了省 token，而应是为了适配不接受推理输出的前端。
  expose_reasoning: true

  # 回复守卫总开关（见 src/orchestration/reply_guard.py）。
  # 它做两件事：①把工具轮里的过程性叙述与正文开头的内心独白从用户可见的
  # 回复里剥掉；②当整轮回复只剩下草稿时，让模型重说一遍。
  # ⚠️ 关掉它会**同时**失去这两件事，其中第二件是「用户拿不到答案」时
  # 唯一的补救手段 —— 所以这个开关的用途是排障，不是日常调节。
  # 关掉后行为完全回到加守卫之前（事件原样透传，逐字流式）。
  reply_guard_enabled: true

  # 回复不可用时，最多要求模型重说几轮。
  # ⚠️ 每一次重试都是一次**完整的模型调用**，直接叠加到用户的等待时间上
  # （实测单轮约 5~8 秒）。设成 3 以上，遇上模型状态不好的一天，
  # 每个请求都会变成十几秒的等待 —— 而用户宁可要一句「没答好」，
  # 也不愿意干等。0 表示不重试（仍会剥离草稿，彻底无内容时发兜底话术）。
  reply_guard_max_retries: 2
