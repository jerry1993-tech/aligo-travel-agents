# ==============================================================================
# 文件职责：**开发环境（dev）** 的配置增量。只写与 `config/base.yaml` **不同**的项，
#           其余全部继承 base —— 这是深合并，不是替换，故不必把整份配置抄一遍。
#
# 上下游依赖：
#   - 上游：加载时机由 `ALIGO__APP__ENV=dev` 决定（src/config/loader.py）。
#   - 下游：覆盖 config/base.yaml 的同名项；随后仍可能被 ALIGO__ 环境变量再覆盖。
#
# ⚠️ 本文件的值**会被 .env 里的同名 ALIGO__ 键整片顶掉**。既有的真实反例（2026-09-24 修）：
#    .env.example 里曾把 ALIGO__APP__LOG_LEVEL 写成 INFO，于是本文件的 DEBUG 完全失效，
#    而文档还在宣称「dev 档日志是 DEBUG」。改动任何一项前，请先确认 .env
#    （以及 .env.example 这份给别人用的模板）里没有与之冲突的同名键。
# ==============================================================================

app:
  # 开发期要看全量信息：工具调用、消息装配、中间件钩子都会打 DEBUG 日志。
  # 生产档（prod.yaml）必须调回 INFO —— DEBUG 会把提示词与业务数据写进日志。
  log_level: DEBUG

milvus:
  # ⚠️ **必须与生产用集合区分开**。开发期会反复灌数据、重建集合，
  #    若与生产共用同一个集合，一次 `milvus_init.py` 就能把线上知识库清空。
  #    这也是 .env.example §五把该键也写成带 `_dev` 后缀的原因（两处一致）。
  collection: aligo_travel_policy_dev

db:
  # 开发期把 SQL 打到日志里，便于排查 ORM 生成语句的问题（如 N+1、意外的全表扫描）。
  # ⚠️ 它会连参数值一起打印，因此**生产必须为 false**（prod.yaml 已设）。
  echo: false
